<!DOCTYPE html>
<html>
<head>
    <title>COMIKAGI</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            animation: slideshow 12s infinite;
            display: flex;
            flex-direction: column;
        }

        /* ===== HEADER ===== */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            z-index: 1000;
        }

        .logo {
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        /* NAVIGATION */
        nav ul {
            list-style: none;
            display: flex;
            gap: 15px;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-size: 13px;
            padding: 6px 10px;
            position: relative;
            transition: 0.3s ease;
        }

        nav ul li a:hover {
            background-color: rgba(0, 195, 255, 0.2);
            border-radius: 4px;
            color: #00c3ff;
        }

        nav ul li a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0%;
            height: 2px;
            background: #00c3ff;
            transition: 0.3s ease;
        }

        nav ul li a:hover::after {
            width: 100%;
        }

        /* ===== HAMBURGER MENU ===== */
        .menu-toggle {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
        }

        .menu-toggle span {
            width: 25px;
            height: 3px;
            background: white;
        }

        /* ===== OVERLAY ===== */
        .overlay {
            flex: 1;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 130px 20px 20px 20px;
            text-align: center;
        }

        .overlay h1 {
            font-size: 32px;
        }

        /* ===== IMAGE CAROUSEL ===== */
        .image-carousel {
            width: 100%;
            overflow: hidden;
            background: #000;
            padding: 10px 0;
        }

        .image-track {
            display: flex;
            gap: 15px;
            animation: scroll 30s linear infinite;
        }

        .image-track img {
            height: 80px;
            border-radius: 5px;
            object-fit: cover;
            max-width: 100%;
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* ===== FOOTER ===== */
        footer {
            background: rgba(0, 0, 0, 0.95);
            color: white;
            padding: 15px 5%;
            font-size: 12px;
        }

        .footer-container {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }

        .footer-section {
            flex: 1;
            min-width: 200px;
        }

        .footer-section h3 {
            margin-bottom: 6px;
            font-size: 14px;
            color: #00c3ff;
        }

        .contact-grid, .location-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 10px;
        }

        footer a {
            color: #00c3ff;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* ===== RESPONSIVE IMPROVEMENTS ===== */

        /* Tablets */
        @media (max-width: 992px) {

            header {
                padding: 12px 4%;
            }

            .logo {
                font-size: 13px;
                max-width: 60%;
            }

            nav ul {
                gap: 10px;
                flex-wrap: wrap;
            }

            nav ul li a {
                font-size: 12px;
                padding: 6px 8px;
            }

            .overlay {
                padding: 140px 20px 40px 20px;
            }

            .overlay h1 {
                font-size: 26px;
            }

            .image-track img {
                height: 70px;
            }

            .footer-container {
                gap: 25px;
            }
        }

        /* Phones */
        @media (max-width: 768px) {

            header {
                padding: 12px 4%;
            }

            nav ul {
                position: absolute;
                top: 100%;
                right: 4%;
                width: 220px;
                background: rgba(0,0,0,0.95);
                flex-direction: column;
                display: none;
                padding: 10px;
                border-radius: 5px;
            }

            nav ul.active {
                display: flex;
            }

            nav ul li a {
                padding: 10px;
            }

            .menu-toggle {
                display: flex;
            }

            .overlay {
                padding: 160px 15px 40px 15px;
            }

            .overlay h1 {
                font-size: 22px;
            }

            .image-track img {
                height: 60px;
            }
        }

        @media (max-width: 600px) {

            /* Logo short version */
            .logo::before {
                content: "COMIKAGI";
                display: block;
            }
            .logo {
                color: transparent;
            }

            .overlay {
                padding: 170px 15px 40px 15px;
            }

            .overlay h1 {
                font-size: 20px;
            }

            .contact-grid,
            .location-grid {
                grid-template-columns: 1fr;
                text-align: center;
            }

            footer {
                font-size: 11px;
            }
        }

        /* ===== BACKGROUND SLIDESHOW ===== */
        @keyframes slideshow {
            0% { background-image: url("image1.png"); }
            33% { background-image: url("image2.png"); }
            66% { background-image: url("image3.png"); }
            100% { background-image: url("image1.png"); }
        }

    </style>
</head>
