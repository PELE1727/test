<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONTACT US - COMIKAGI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
text-transform:uppercase;
}

/* BODY */
body{
min-height:100vh;
background-color:#111;
color:white;
display:flex;
flex-direction:column;
}

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
z-index:-1;
}

/* HEADER */
header{
position:fixed;
top:0;
width:100%;
background:rgba(0,0,0,0.9);
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 5%;
z-index:1000;
}

.logo a{
color:white;
font-size:14px;
font-weight:bold;
text-decoration:none;
}

/* NAV */
nav ul{
list-style:none;
display:flex;
gap:15px;
}

nav ul li a{
text-decoration:none;
color:white;
font-size:13px;
padding:6px 10px;
border-radius:25px;
transition:0.3s;
}

nav ul li a:hover{
background:#00c3ff;
color:black;
}

/* HAMBURGER */
.menu-toggle{
display:none;
font-size:28px;
cursor:pointer;
}

/* MAIN CONTENT CENTERING */
.main-content{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding-top:100px;
}

/* CONTACT */
.contact-container{
padding:50px 8%;
max-width:1100px;
width:100%;
background:rgba(20,20,20,0.92);
border-radius:8px;
}

.contact-container h1{
text-align:center;
margin-bottom:40px;
font-size:30px;
}

.contact-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:50px;
}

/* INFO */
.contact-info p{
margin-bottom:10px;
font-size:14px;
text-transform:none;
}

.contact-info a{
color:#00c3ff;
text-decoration:none;
}

/* FORM */
form{
display:flex;
flex-direction:column;
gap:15px;
}

input,textarea{
padding:14px;
border:2px solid #555;
border-radius:6px;
background:#222;
color:white;
text-transform:none;
}

button{
padding:14px;
background:#00c3ff;
border:none;
cursor:pointer;
border-radius:6px;
}

.success-message{
display:none;
background:#0f0;
color:black;
padding:10px;
border-radius:5px;
text-align:center;
}

/* FOOTER */
footer{
background:#000;
padding:20px;
text-align:center;
font-size:12px;
}

footer a{
color:#00c3ff;
text-decoration:none;
margin:0 5px;
}

/* MOBILE */
@media(max-width:768px){

nav{
position:absolute;
top:70px;
left:0;
width:100%;
background:#000;
max-height:0;
overflow:hidden;
}

nav.active{max-height:500px;}

nav ul{flex-direction:column;}

.menu-toggle{display:block;}

.contact-grid{grid-template-columns:1fr;}

.main-content{
padding-top:120px;
}

}
</style>
</head>

<body>

<header>
<div class="logo">
<a href="index.html">COMIKAGI</a>
</div>

<div class="menu-toggle" id="menuToggle">☰</div>

<nav id="navMenu">
<ul>
<li><a href="home.html">HOME</a></li>
<li><a href="about.html">ABOUT</a></li>
<li><a href="services.html">SERVICES</a></li>
<li><a href="contact.html">CONTACT</a></li>
</ul>
</nav>
</header>

<div class="main-content">

<section class="contact-container">

<h1>CONTACT COMIKAGI</h1>

<div class="contact-grid">

<div class="contact-info">
<p><strong>Company:</strong> COMIKAGI</p>
<p><strong>Phone:</strong> +250783419757</p>
<p><strong>Email:</strong> <a href="mailto:comikagi2030@gmail.com">comikagi2030@gmail.com</a></p>
<p><strong>Location:</strong> Gakenke District, Rwanda</p>
</div>

<div>

<div class="success-message" id="successMsg">
Message sent successfully!
</div>

<form action="https://formspree.io/f/yourformid" method="POST" id="contactForm">

<input type="text" name="_gotcha" style="display:none">

<input type="text" name="name" placeholder="Your Name" required>
<input type="email" name="email" placeholder="Your Email" required>
<input type="text" name="subject" placeholder="Subject" required>
<textarea name="message" placeholder="Your Message" required></textarea>

<button type="submit">Send Message</button>

</form>

</div>

</div>

</section>

</div>

<footer>
© 2026 COMIKAGI |
<a href="privacy_policy.html">Privacy Policy</a> |
<a href="terms.html">Terms of Service</a>
</footer>

<script>
const menuToggle=document.getElementById("menuToggle");
const navMenu=document.getElementById("navMenu");

menuToggle.onclick=()=>{
navMenu.classList.toggle("active");
};

// confirmation message
const form=document.getElementById("contactForm");
form.addEventListener("submit",()=>{
document.getElementById("successMsg").style.display="block";
});
</script>

</body>
</html>
