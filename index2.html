<!DOCTYPE html>
<html>
<head>
    <title>COMIKAGI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            animation: slideshow 12s infinite;
            display: flex;
            flex-direction: column;
        }

        /* ===== HEADER ===== */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            z-index: 1000;
        }

        .logo {
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        /* Hamburger */
        .menu-toggle {
            display: none;
            font-size: 28px;
            color: white;
            cursor: pointer;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-size: 14px;
            padding: 8px 12px;
            display: block;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #00c3ff;
        }

        /* ===== OVERLAY CONTENT ===== */
        .overlay {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-top: 100px;
            text-align: center;
        }

        .overlay h1 {
            font-size: 38px;
            margin-bottom: 15px;
        }

        .overlay p {
            font-size: 18px;
        }

        /* ===== FOOTER ===== */
        footer {
            background: rgba(0, 0, 0, 0.95);
            color: white;
            padding: 10px 6%;
            font-size: 12px;
        }

        .footer-container {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .footer-section {
            width: 45%;
            min-width: 200px;
        }

        .footer-section h3 {
            margin-bottom: 4px;
            font-size: 13px;
            color: #00c3ff;
        }

        footer a {
            color: #00c3ff;
            text-decoration: none;
        }

        .contact-grid, .location-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px 10px;
            font-size: 12px;
        }

        /* ===== BACKGROUND SLIDESHOW ===== */
        @keyframes slideshow {
            0% { background-image: url("images/image1.png"); }
            33% { background-image: url("images/image2.png"); }
            66% { background-image: url("images/image3.png"); }
            100% { background-image: url("images/image1.png"); }
        }

        /* ============================= */
        /* ===== MOBILE RESPONSIVE ===== */
        /* ============================= */
        @media (max-width: 768px) {

            header {
                padding: 15px 20px;
            }

            .logo::after {
                content: "COMIKAGI";
            }

            .logo {
                font-size: 18px;
            }

            nav {
                position: absolute;
                top: 70px;
                left: 0;
                width: 100%;
                background: rgba(0,0,0,0.95);
                display: none;
            }

            nav ul {
                flex-direction: column;
                gap: 0;
            }

            nav ul li {
                border-top: 1px solid #333;
            }

            nav ul li a {
                padding: 15px;
            }

            .menu-toggle {
                display: block;
            }

            nav.active {
                display: block;
            }

            .footer-container {
                flex-direction: column;
                gap: 20px;
            }

            .footer-section {
                width: 100%;
            }

            .overlay h1 {
                font-size: 26px;
            }

            .overlay p {
                font-size: 15px;
            }
        }

    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo">COOPERATIVE MINIERE KABABARA ET GIKINGO</div>

        <div class="menu-toggle" onclick="toggleMenu()">☰</div>

        <nav id="navMenu">
            <ul>
                <li><a href="#">HOME</a></li>
                <li><a href="#">ABOUT</a></li>
                <li><a href="#">SERVICES</a></li>
                <li><a href="#">OUR WORK</a></li>
                <li><a href="#">PUBLICATION</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Overlay -->
    <div class="overlay">
        <h1>WELCOME TO COMIKAGI</h1>
        <p></p>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-container">

            <div class="footer-section">
                <h3>CONTACTS</h3>
                <div class="contact-grid">
                    <p><strong>TIN:</strong></p>
                    <p>101773235</p>
                    <p><strong>TEL:</strong></p>
                    <p>+250783419757</p>
                    <p><strong>EMAIL:</strong></p>
                    <p><a href="mailto:comikagi2030@gmail.com">comikagi2030@gmail.com</a></p>
                </div>
            </div>

            <div class="footer-section">
                <h3>LOCATION</h3>
                <div class="location-grid">
                    <p>NORTH PROVINCE</p>
                    <p>GAKENKE DISTRICT</p>
                    <p>RULI SECTOR</p>
                    <p>GIKINGO CELL</p>
                </div>
            </div>

        </div>
    </footer>

    <script>
        function toggleMenu() {
            document.getElementById("navMenu").classList.toggle("active");
        }
    </script>

</body>
</html>
